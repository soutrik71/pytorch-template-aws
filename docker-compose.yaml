version: "3.9"

services:
  redis:
    image: redis:7.4.1
    container_name: redis-server
    command: ["redis-server", "--requirepass", "redispassword"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDIS_PASSWORD: redispassword
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis_data:/data
    restart: always
  
  model-server:
    build:
      context: .
      dockerfile: model-server/Dockerfile
    container_name: model-server
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
      - PROJECT_ROOT=/app
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  web-server:
    build:
      context: .
      dockerfile: web-server/Dockerfile
    container_name: web-server
    ports:
      - "9000:9000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispassword}
      - MODEL_SERVER_URL=http://model-server:8000
      - PROJECT_ROOT=/app
    depends_on:
      - "redis"
      - "model-server"
    restart: always

volumes:
  redis_data:
    driver: local
